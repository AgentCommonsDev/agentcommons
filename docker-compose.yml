x-application: &application
  image: agentcommons:${IMAGE_TAG:-local}
  build: .
  env_file: .env
  init: true

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: agentcommons
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: agentcommons
    volumes: ["agentcommons-db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentcommons -d agentcommons"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  clickhouse:
    image: clickhouse/clickhouse-server:26.8.2.7
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_MIGRATION_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_MIGRATION_PASSWORD:?Set CLICKHOUSE_MIGRATION_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - agentcommons-traces:/var/lib/clickhouse
      - ./packages/traces/config/privacy.xml:/etc/clickhouse-server/config.d/privacy.xml:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  migrate:
    <<: *application
    command: ["pnpm", "db:migrate"]
    environment:
      DATABASE_MIGRATION_URL: ${DATABASE_MIGRATION_URL:?Set DATABASE_MIGRATION_URL using host db}
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    restart: "no"
  api:
    <<: *application
    environment:
      DATABASE_MIGRATION_URL: ""
      DATABASE_TRACE_CONTROL_URL: ""
      CLICKHOUSE_MIGRATION_PASSWORD: ""
      CLICKHOUSE_URL: http://clickhouse:8123
      POSTGRES_PASSWORD: ""
      HOST: 0.0.0.0
      PORT: "3000"
    ports: ["${API_BIND_ADDRESS:-127.0.0.1}:3000:3000"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    # Rotated on disk so one noisy release cannot fill the host; the last 250 MiB stay.
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: "5"
    restart: unless-stopped

volumes:
  agentcommons-db:
  agentcommons-traces:
