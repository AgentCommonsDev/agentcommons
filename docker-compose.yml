# The API and its migration run the published release (ADR 0059). AGENTCOMMONS_IMAGE in
# .env pins another tag or a local build; `docker compose build` still builds from here.
# docker-compose.caddy.yml adds HTTPS; docker-compose.clickhouse-cloud.yml moves the trace
# store to ClickHouse Cloud; docker-compose.external-database.yml moves PostgreSQL to a
# managed server such as Aurora (AGENTCOMMONS_DATABASE=external, ADR 0063).
# Every container that talks to PostgreSQL detects a dead peer within about a minute
# instead of the kernel defaults (two hours of keepalive idle, fifteen retransmissions or
# about sixteen minutes for in-flight data). ADR 0077: on 2026-09-12 a host package upgrade
# restarted networking under the stack; ClickHouse's pooled control-plane connections to
# Aurora died silently and the next reads hung for the full retransmission limit, holding
# the connection pool and the query slots so every read failed for sixteen minutes.
x-dead-peer-detection: &dead-peer-detection
  net.ipv4.tcp_keepalive_time: "30"
  net.ipv4.tcp_keepalive_intvl: "10"
  net.ipv4.tcp_keepalive_probes: "3"
  net.ipv4.tcp_retries2: "6"
x-application: &application
  image: ${AGENTCOMMONS_IMAGE:-ghcr.io/agentcommonsdev/agentcommons:stable}
  build: .
  env_file: .env
  init: true
  sysctls: *dead-peer-detection

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: agentcommons
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: agentcommons
    volumes: ["agentcommons-db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentcommons -d agentcommons"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  clickhouse:
    image: clickhouse/clickhouse-server:26.8.2.7
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_MIGRATION_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_MIGRATION_PASSWORD:?Set CLICKHOUSE_MIGRATION_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
      # The server runs as the clickhouse user but inherits root's HOME; when PostgreSQL
      # offers TLS (a managed database, ADR 0063) libpq looks for a client certificate
      # there and fails on the unreadable /root. Its own directory is readable and empty.
      HOME: /var/lib/clickhouse
    sysctls: *dead-peer-detection
    volumes:
      - agentcommons-traces:/var/lib/clickhouse
      - ./packages/traces/config/privacy.xml:/etc/clickhouse-server/config.d/privacy.xml:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  migrate:
    <<: *application
    command: ["pnpm", "db:migrate"]
    environment:
      DATABASE_MIGRATION_URL: ${DATABASE_MIGRATION_URL:?Set DATABASE_MIGRATION_URL using host db}
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    restart: "no"
  api:
    <<: *application
    environment:
      DATABASE_MIGRATION_URL: ""
      DATABASE_TRACE_CONTROL_URL: ""
      CLICKHOUSE_MIGRATION_PASSWORD: ""
      CLICKHOUSE_URL: http://clickhouse:8123
      POSTGRES_PASSWORD: ""
      HOST: 0.0.0.0
      PORT: "3000"
    ports: ["${API_BIND_ADDRESS:-127.0.0.1}:3000:3000"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    # Rotated on disk so one noisy release cannot fill the host; the last 250 MiB stay.
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: "5"
    restart: unless-stopped

volumes:
  agentcommons-db:
  agentcommons-traces:
