name: Workspace setup
description: pnpm, Node 24 with the pnpm cache, and a frozen install of the workspace. Runs after checkout.
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
