name: SDK release
on:
  push:
    tags: ["sdk-v*"]
permissions:
  contents: read
concurrency:
  group: sdk-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.7"
          python-version: "3.12"
      - name: Check release tag and versions
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          pnpm sdk:release:check
      - run: uv sync --project packages/sdk-python --locked
      - run: pnpm sdk:check
      - run: pnpm --filter @agentcommons/sdk typecheck
      - run: pnpm exec vitest run packages/sdk/test
      - run: pnpm test:sdk:python
      - name: Build registry distributions
        run: |
          mkdir -p release/npm
          pnpm --filter @agentcommons/sdk pack --pack-destination "$GITHUB_WORKSPACE/release/npm"
          uv build --project packages/sdk-python --out-dir release/pypi
          uv run --project packages/sdk-python --locked twine check --strict release/pypi/*
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-npm
          path: release/npm/*.tgz
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-pypi
          path: release/pypi/*
          if-no-files-found: error
  npm:
    needs: build
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
      - uses: actions/download-artifact@v4
        with:
          name: sdk-npm
          path: dist
      # Node 24 includes an npm version that supports trusted publishing (>=11.5.1).
      - run: npm publish dist/*.tgz --access public --provenance --ignore-scripts
        env:
          # Optional bootstrap credential for the first npm publish. Later releases use OIDC.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sdk-pypi
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
