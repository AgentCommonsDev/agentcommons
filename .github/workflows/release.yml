name: Release
# Publishes one image per green main commit to the GitHub Container Registry. Hosts pull it
# themselves (scripts/self-host/agentcommons-update.sh) after checking its Sigstore
# signature; nothing here reaches any cloud account. The credentials are the workflow's own
# token and the hook signing key, a secret of the `release` environment (ADR 0102), which
# GitHub hands only to jobs that environment's deployment rules admit.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
  id-token: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  image:
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: release
    steps:
      # Installed shims update only from a signed hook manifest (ADR 0102): an unsigned
      # release would strand every installation on its current bundle, so it fails here,
      # before anything is pushed.
      - name: Require the hook signing key
        env:
          HOOK_SIGNING_KEY: ${{ secrets.HOOK_SIGNING_KEY }}
        run: |
          [ -n "$HOOK_SIGNING_KEY" ] || {
            echo "::error::The release environment has no HOOK_SIGNING_KEY secret (ADR 0102)."
            exit 1
          }
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      # The registry path must be lowercase; the version is the 12-character commit, which
      # is also the image tag suffix and what Admin → Status shows.
      - id: release
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/agentcommons" >> "$GITHUB_OUTPUT"
          echo "version=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.release.outputs.image }}:sha-${{ steps.release.outputs.version }}
            ${{ steps.release.outputs.image }}:stable
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          # The Dockerfile turns the revision and created arguments into the OCI labels the
          # host updater compares (spec §13); the on-host build passes the same arguments.
          build-args: |
            AGENTCOMMONS_VERSION=${{ steps.release.outputs.version }}
            AGENTCOMMONS_REVISION=${{ github.event.workflow_run.head_sha || github.sha }}
            AGENTCOMMONS_CREATED=${{ steps.release.outputs.created }}
          # Mounted for the Dockerfile's signing step only; it never reaches a layer.
          secrets: |
            hook_signing_key=${{ secrets.HOOK_SIGNING_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Keyless signing: the certificate binds the image to this workflow and commit. The
      # version matches the verifier the host updater runs (scripts/self-host/lib.sh).
      - uses: sigstore/cosign-installer@v3
        with:
          cosign-release: v2.6.5
      - run: cosign sign --yes "${{ steps.release.outputs.image }}@${{ steps.build.outputs.digest }}"
