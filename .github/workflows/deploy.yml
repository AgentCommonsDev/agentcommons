name: Infrastructure
on:
  pull_request:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      stack:
        description: Deployment stack
        type: choice
        required: true
        options: [dev, prod]
permissions:
  contents: read
jobs:
  preview:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: preview
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      # Environment variables bind when the runner takes the job, after the job-level `if`, so the
      # AWS check is the first step. Dependabot runs and unconfigured environments have no role.
      - id: aws
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_ROLE_ARN: ${{ vars.AWS_PREVIEW_ROLE_ARN }}
        run: |
          if [ -z "$AWS_REGION" ] || [ -z "$AWS_ROLE_ARN" ]; then
            echo '::notice::Skipped: Set AWS_REGION and AWS_PREVIEW_ROLE_ARN on the preview environment to preview infrastructure changes.'
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'configured=true' >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.aws.outputs.configured == 'true'
      - uses: ./.github/actions/setup
        if: steps.aws.outputs.configured == 'true'
      - uses: aws-actions/configure-aws-credentials@v4
        if: steps.aws.outputs.configured == 'true'
        with:
          role-to-assume: ${{ vars.AWS_PREVIEW_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: pulumi/actions@v6
        if: steps.aws.outputs.configured == 'true'
        with:
          command: preview
          stack-name: ${{ vars.PULUMI_DEV_STACK }}
          work-dir: infra
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
  deploy:
    if: >-
      vars.DEPLOYMENTS_ENABLED == 'true' && (
      (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    environment: ${{ inputs.stack || 'dev' }}
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: deploy-${{ inputs.stack || 'dev' }}
      cancel-in-progress: false
    steps:
      - id: aws
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        run: |
          if [ -z "$AWS_REGION" ] || [ -z "$AWS_ROLE_ARN" ]; then
            echo '::notice::Skipped: Set AWS_REGION and AWS_DEPLOY_ROLE_ARN on the deployment environment to deploy.'
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'configured=true' >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.aws.outputs.configured == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: ./.github/actions/setup
        if: steps.aws.outputs.configured == 'true'
      - run: pnpm exec playwright install --with-deps
        if: steps.aws.outputs.configured == 'true' && github.event_name == 'workflow_dispatch'
      # Manual production releases verify the selected commit too.
      - run: pnpm verify
        if: steps.aws.outputs.configured == 'true' && github.event_name == 'workflow_dispatch'
      - uses: aws-actions/configure-aws-credentials@v4
        if: steps.aws.outputs.configured == 'true'
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: pulumi/actions@v6
        if: steps.aws.outputs.configured == 'true'
        with:
          command: up
          stack-name: ${{ vars.PULUMI_STACK }}
          work-dir: infra
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
