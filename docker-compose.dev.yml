services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: agentcommons
      POSTGRES_PASSWORD: agentcommons
      POSTGRES_DB: agentcommons
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["agentcommons-db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentcommons -d agentcommons"]
      interval: 5s
      timeout: 3s
      retries: 20
  clickhouse:
    image: clickhouse/clickhouse-server:26.8.2.7
    environment:
      CLICKHOUSE_PASSWORD: local-clickhouse-admin
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["127.0.0.1:8123:8123"]
    volumes:
      - agentcommons-traces:/var/lib/clickhouse
      - ./packages/traces/config/privacy.xml:/etc/clickhouse-server/config.d/privacy.xml:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  agentcommons-db:
  agentcommons-traces:
